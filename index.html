    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <body class="bg-[#F4EFE3] text-[#171717] antialiased font-sans selection:bg-[#E9FF57] selection:text-[#171717]">
    <div id="root"></div>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const docWidth = document.documentElement.offsetWidth;
          const scrollWidth = document.documentElement.scrollWidth;
          if (scrollWidth > docWidth) {
            console.log('--- OVERFLOW DEBUG ---');
            console.log('Doc Width:', docWidth, 'Scroll Width:', scrollWidth);
            const all = document.getElementsByTagName("*");
            for (let el of all) {
              if (el.offsetWidth > docWidth) {
                console.log('Overflowing Element:', el.tagName, el.className, 'Width:', el.offsetWidth);
              }
            }
          }
        }, 2000);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
