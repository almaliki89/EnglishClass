name: Refresh patched dependency lockfile

on:
  push:
    branches: [security/dependency-fix]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dependency-fix branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-fix
          persist-credentials: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from reviewed overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate clean install
        run: npm ci --ignore-scripts

      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json and the reviewed overrides."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): regenerate dependency lockfile with patched versions"
          git push origin HEAD:security/dependency-fix
