name: Tense Teaching Functional Validation

on:
  push:
    branches: [ feat/tense-teaching-rebuild ]
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/data/tenseTeachingGuides.ts'
      - 'src/components/TenseLearningJourney.tsx'
      - 'src/components/GrammarLearningJourney.tsx'
      - 'scripts/verify_english_curriculum.ts'
      - 'tests/e2e/tense_learning_journey.spec.ts'
      - 'tests/e2e/grammar_learning_experience.spec.ts'
      - 'tests/e2e/curriculum_and_routes.spec.ts'
      - '.github/workflows/tense-learning-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tense-teaching:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run lint

      - name: Verify Curriculum and Tense Guide Coverage
        run: npm run test

      - name: Deep Architecture Audit
        run: npm run test:audit

      - name: Install Firebase Rules Emulator tooling
        run: npm install --no-save --package-lock=false --prefer-offline @firebase/rules-unit-testing firebase-tools

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Type-check Firebase Rules Emulator tests
        run: npx tsc --noEmit -p tsconfig.rules-tests.json

      - name: Run Firebase Rules Emulator Tests
        run: npx firebase emulators:exec --project demo-englishclass-rules-test --only firestore,storage "npm run test:rules"

      - name: Security Regression Suite
        run: npm run test:security

      - name: Curriculum Hierarchy Tests
        run: npm run test:hierarchy

      - name: Source Alignment Tests
        run: npm run test:source-alignment

      - name: Reading Passage Provenance Audit
        run: npm run test:reading

      - name: Production Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Complete Playwright E2E Suite
        run: npx playwright test
        env:
          VITE_E2E_MODE: "true"

      - name: Upload QA Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tense-teaching-functional-qa
          path: test-results
          if-no-files-found: warn
          retention-days: 14
