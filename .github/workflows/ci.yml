name: EnglishClass CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Report Full Dependency Audit
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-full.json" || true
          node - "$RUNNER_TEMP/npm-audit-full.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const packages = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            isDirect: item.isDirect,
            range: item.range,
            via: (item.via ?? []).map((v) => typeof v === 'string' ? v : ({ name: v.name, title: v.title, url: v.url, range: v.range, severity: v.severity })),
            fixAvailable: item.fixAvailable
          }));
          console.log(JSON.stringify({ scope: 'all', totals: report.metadata?.vulnerabilities, packages }, null, 2));
          NODE

      - name: Report Production Dependency Audit
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node - "$RUNNER_TEMP/npm-audit-production.json" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const packages = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            isDirect: item.isDirect,
            range: item.range,
            via: (item.via ?? []).map((v) => typeof v === 'string' ? v : ({ name: v.name, title: v.title, url: v.url, range: v.range, severity: v.severity })),
            fixAvailable: item.fixAvailable
          }));
          console.log(JSON.stringify({ scope: 'production-only', totals: report.metadata?.vulnerabilities, packages }, null, 2));
          NODE

      - name: Enforce Full Dependency Audit Gate
        run: npm audit --audit-level=low

      - name: Enforce Production Dependency Audit Gate
        run: npm audit --omit=dev --audit-level=low

      - name: Run TypeScript Typecheck (Linter)
        run: npm run lint

      - name: Run Master Curriculum & Security Verification
        run: npm run test

      - name: Run Deep Architecture Audit
        run: npx tsx scripts/deep_architecture_audit.ts

      - name: Install Firebase Rules Emulator tooling
        run: npm install --no-save --package-lock=false --prefer-offline @firebase/rules-unit-testing firebase-tools

      - name: Setup Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore and Storage Security Rules Emulator Tests
        run: npx firebase emulators:exec --project demo-englishclass-rules-test --only firestore,storage "npm run test:rules"

      - name: Run V6 Security & Hardening Regression Suite
        run: npm run test:security

      - name: Run Curriculum Hierarchy Runtime Unit Tests
        run: npm run test:hierarchy

      - name: Verify Source Content Alignment
        run: npm run test:source-alignment

      - name: Build Production Bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Test Suite
        run: npx playwright test
        env:
          VITE_E2E_MODE: "true"

      - name: Upload Responsive QA Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-qa-screenshots
          path: test-results/responsive-qa
          if-no-files-found: warn
          retention-days: 14
