name: EnglishClass CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck (Linter)
        run: npm run lint

      - name: Run Master Curriculum & Security Verification
        run: npm run test

      - name: Run Deep Architecture Audit
        run: npx tsx scripts/deep_architecture_audit.ts

      - name: Run V6 Security & Hardening Regression Suite
        run: npm run test:security

      - name: Build Production Bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Test Suite
        run: npx playwright test
        env:
          VITE_E2E_MODE: "true"
